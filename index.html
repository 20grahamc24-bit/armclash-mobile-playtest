<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07101d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ArmClash Mobile Playtest</title>
    <style>
      :root { color-scheme: dark; background: #07101d; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07101d; }
      body { position: fixed; inset: 0; height: 100dvh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #game-shell, #unity-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #game-shell { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: #07101d; }
      #unity-canvas { display: block; background: #07101d; touch-action: none; }
      #loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; background: radial-gradient(circle at 50% 35%, #14243b 0, #07101d 62%); transition: opacity .25s ease; }
      #loading.done { opacity: 0; pointer-events: none; }
      .loading-card { width: min(78vw, 420px); text-align: center; }
      .eyebrow { color: #72dcff; font-size: 12px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 8px 0 22px; color: #f5f7ff; font-size: clamp(30px, 8vw, 58px); line-height: .95; letter-spacing: -.045em; }
      .track { height: 8px; overflow: hidden; border: 1px solid #38506f; border-radius: 99px; background: #0b1727; }
      #progress { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #32aaf3, #78e9ff); transition: width .12s linear; }
      #loading-label { margin-top: 10px; color: #9eb0c8; font-size: 13px; }
      #rotate { display: none; position: absolute; inset: 0; z-index: 8; place-items: center; padding: 32px; text-align: center; background: rgba(5, 12, 22, .97); }
      #rotate .phone { display: block; width: 42px; height: 72px; margin: 0 auto 18px; border: 4px solid #72dcff; border-radius: 9px; transform: rotate(90deg); }
      #rotate strong { display: block; color: #f5f7ff; font-size: 22px; }
      #rotate span { display: block; max-width: 300px; margin-top: 8px; color: #a8b8cc; font-size: 14px; line-height: 1.45; }
      #fullscreen { position: absolute; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 3; display: none; min-width: 44px; min-height: 44px; border: 1px solid #44607d; border-radius: 10px; color: #eaf7ff; background: rgba(8, 19, 33, .82); font-weight: 700; cursor: pointer; }
      #error { display: none; position: absolute; inset: auto 12px calc(12px + env(safe-area-inset-bottom)); z-index: 10; padding: 12px 14px; border-radius: 10px; color: #fff; background: #a52530; font-size: 13px; line-height: 1.4; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: grid; } }
      @media (hover: hover) and (pointer: fine) { #fullscreen { display: block; } }
      @media (prefers-reduced-motion: reduce) { #loading, #progress { transition: none; } }
    </style>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="-1" aria-label="ArmClash game"></canvas>
      <section id="loading" aria-live="polite">
        <div class="loading-card">
          <div class="eyebrow">Mobile playtest</div>
          <h1>ARM CLASH</h1>
          <div class="track"><div id="progress"></div></div>
          <div id="loading-label">Loading 0%</div>
        </div>
      </section>
      <aside id="rotate">
        <div>
          <i class="phone" aria-hidden="true"></i>
          <strong>Turn your phone sideways</strong>
          <span>ArmClash is tuned for landscape playtesting.</span>
        </div>
      </aside>
      <button id="fullscreen" type="button" aria-label="Enter fullscreen">Full screen</button>
      <div id="error" role="alert"></div>
    </main>

    <script src="Build/8b37fd65afa8636b9df295648509dd17.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const progress = document.querySelector("#progress");
      const loadingLabel = document.querySelector("#loading-label");
      const errorBox = document.querySelector("#error");
      const isPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      const config = {
        arguments: [],
        dataUrl: "Build/0547e62db241a03c0f17c137a2c30e33.data.unityweb",
        frameworkUrl: "Build/0fe8ed8c77a00cfb6b4e4150aaa1cc4c.framework.js.unityweb",
        codeUrl: "Build/05c69791c8bc6708378c49a08ddbf46d.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ArmclashPrototype",
        productVersion: "0.1.0",
        devicePixelRatio: isPhone ? 1 : Math.min(window.devicePixelRatio || 1, 2)
      };

      function showError(message) {
        errorBox.textContent = "The playtest could not start. Reload this page. If it still fails, send this message: " + message;
        errorBox.style.display = "block";
        loading.classList.add("done");
      }

      createUnityInstance(canvas, config, (value) => {
        const percent = Math.round(value * 100);
        progress.style.width = percent + "%";
        loadingLabel.textContent = "Loading " + percent + "%";
      }).then((unityInstance) => {
        loading.classList.add("done");
        document.querySelector("#fullscreen").addEventListener("click", () => unityInstance.SetFullscreen(1));
      }).catch((message) => showError(String(message)));
    </script>
  </body>
</html>
